version: '3.8'

services:
  library-management:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - JAVA_OPTS=-Xmx512m
    restart: unless-stopped
    container_name: library-management-system

  # Optional: Add a reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - library-management
    restart: unless-stopped
    profiles:
      - production
